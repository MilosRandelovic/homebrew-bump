name: Update bump-core dependency

# Triggered by bump-core's release workflow (repository_dispatch) whenever a new bump-core version is tagged. Instead of committing the dependency bump straight to main, this opens a reviewable pull request that runs through CI. Merging that PR is a normal push to main, which then triggers the release workflow.

on:
  repository_dispatch:
    types: [ bump-core-release ]
  workflow_dispatch:
    inputs:
      tag:
        description: bump-core tag to install (for example, v2.0.0)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  open-update-pr:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.1'

    - name: Bump bump-core dependency
      id: dependency
      env:
        DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        MANUAL_TAG: ${{ inputs.tag }}
      run: |
        CORE_TAG="${DISPATCH_TAG:-$MANUAL_TAG}"
        echo "Updating bump-core to ${CORE_TAG}"
        go get "github.com/MilosRandelovic/bump-core/v2@${CORE_TAG}"
        go mod tidy
        echo "tag=$CORE_TAG" >> "$GITHUB_OUTPUT"

    - name: Verify build and tests
      run: |
        go build -o bump
        go test ./...

    - name: Create pull request
      uses: peter-evans/create-pull-request@v8
      with:
        # Use a PAT so the PR triggers the CI workflow. Falls back to the default token, in which case CI must be re-run manually (GitHub does not trigger workflows for PRs opened by GITHUB_TOKEN).
        token: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}
        commit-message: "Update bump-core to ${{ steps.dependency.outputs.tag }}"
        title: "Update bump-core to ${{ steps.dependency.outputs.tag }}"
        body: |
          Automated dependency update triggered by the release of bump-core ${{ steps.dependency.outputs.tag }}.

          - Bumps `github.com/MilosRandelovic/bump-core/v2` to `${{ steps.dependency.outputs.tag }}`
          - Runs `go mod tidy`

          Merging this PR to `main` triggers the release workflow, which tags the release and opens the Homebrew formula update PR.
        branch: dependency/bump-core-${{ steps.dependency.outputs.tag }}
        delete-branch: true
        labels: dependencies
