name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-lint-test:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Install dependencies
      run: go mod download

    - name: Check formatting
      run: test -z "$(gofmt -l .)"

    - name: Run go vet
      run: go vet ./...

    - name: Run tests
      run: go test ./...

    - name: Run race detector
      run: go test -race ./...

    - name: Build and run CLI smoke tests
      run: make smoke

    - name: Install ShellCheck
      run: brew install shellcheck

    - name: Run ShellCheck
      run: shellcheck scripts/*.sh

    - name: Check formula style
      run: brew style Formula/bump.rb

    - name: Register checkout as tap
      run: |
        brew tap MilosRandelovic/bump "$PWD"
        brew trust --formula MilosRandelovic/bump/bump

    - name: Install formula from source
      run: brew install --build-from-source MilosRandelovic/bump/bump

    - name: Run formula tests
      run: brew test MilosRandelovic/bump/bump
